<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — الصفحة غير موجودة | RAM Doctor</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#fafafa;--fg:#18181b;--muted:#71717a;--border:#e4e4e7;--accent:#0067c0;--accent-fg:#fff;--line:rgba(24,24,27,.08);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#09090b;--fg:#f4f4f5;--muted:#a1a1aa;--border:#27272a;--accent:#60cdff;--accent-fg:#00263d;--line:rgba(244,244,245,.09);color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1.5rem;background:var(--bg);color:var(--fg);font-family:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Tahoma,Arial,sans-serif;line-height:1.7;text-align:center;
  background-image:repeating-linear-gradient(to right,var(--line) 0 1px,transparent 1px 80px);background-position:center top}
main{max-width:30rem}
.code{font-size:clamp(4rem,16vw,7rem);font-weight:700;line-height:1;letter-spacing:-.04em;margin:0 0 .5rem}
h1{font-size:1.4rem;margin:0 0 .6rem}
p{color:var(--muted);margin:0 0 1.6rem}
a.btn{display:inline-flex;align-items:center;height:3rem;padding-inline:1.6rem;border-radius:.7rem;background:var(--accent);color:var(--accent-fg);font-weight:600;text-decoration:none}
a.btn:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.en{display:block;margin-top:1.6rem;font-size:.9rem;color:var(--muted)}
.en a{color:var(--accent)}
img{width:48px;height:48px;margin-bottom:1rem}
</style>
</head>
<body>
<main>
  <img src="assets/favicon.svg" alt="" width="48" height="48">
  <div class="code" aria-hidden="true">404</div>
  <h1>هذه الصفحة غير موجودة</h1>
  <p>الرابط الذي فتحته غير صحيح أو انتقلت الصفحة.</p>
  <a class="btn" href="./">العودة إلى الصفحة الرئيسية</a>
  <span class="en" lang="en" dir="ltr">Page not found. <a href="./">Back to RAM Doctor</a></span>
</main>
</body>
</html>
